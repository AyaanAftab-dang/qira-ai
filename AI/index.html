<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QIRA - Quick Intelligent Response Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">Q</div>
            <span>QIRA</span>
        </div>

        <button id="newChat" class="new-chat">
            + New Chat
        </button>

        <div class="sidebar-bottom">
            <strong>QIRA AI</strong>
            <small>Quick Intelligent Response Assistant</small>
        </div>

    </aside>


    <main class="chat-area">

        <header class="topbar">
            <div>
                <strong>QIRA</strong>
                <span class="status">● Online</span>
            </div>
        </header>


        <section id="messages" class="messages">

            <div class="welcome">

                <div class="big-logo">Q</div>

                <h1>How can I help?</h1>

                <p>Ask QIRA anything.</p>

            </div>

        </section>


        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    placeholder="Message QIRA..."
                    rows="1"
                ></textarea>

                <button id="sendButton">
                    ➤
                </button>

            </div>

            <p class="disclaimer">
                QIRA can make mistakes. Check important information.
            </p>

        </div>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
